name: Android Todo compilation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: ''
      - run: sdkmanager "platform-tools" "platforms;android-32" "build-tools;32.0.0"
      - run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug
